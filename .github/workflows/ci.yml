name: extension-ci

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "bilibili-vocab-extension/**"
      - "docs/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "bilibili-vocab-extension/**"
      - "docs/**"

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bilibili-vocab-extension
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build React UI
        run: pnpm run build

      - name: Build Extension Bundle
        run: pnpm run build:extension
