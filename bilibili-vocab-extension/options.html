<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bilibili Vocabulary Subtitle - 设置</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", "PingFang SC", sans-serif;
        background: #131722;
        color: #eef3ff;
      }

      .panel {
        max-width: 600px;
        margin: 28px auto;
        padding: 24px;
        border-radius: 12px;
        background: #1b2130;
        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      h1 {
        margin: 0 0 20px;
        font-size: 22px;
      }

      .field {
        margin-bottom: 18px;
      }

      .field-title {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
      }

      .inline {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .levels {
        display: grid;
        grid-template-columns: repeat(2, minmax(120px, 1fr));
        gap: 8px 12px;
      }

      input[type="range"] {
        width: 100%;
      }

      input[type="number"] {
        width: 120px;
      }

      input[type="number"],
      select,
      button {
        font-size: 14px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        padding: 8px 10px;
        background: #101520;
        color: #eef3ff;
      }

      button {
        cursor: pointer;
        font-weight: 600;
        background: #2f73ff;
        border: none;
        width: 100%;
      }

      select {
        width: 220px;
      }

      #status {
        margin-top: 12px;
        min-height: 18px;
        color: #8fd2a6;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <h1>Bilibili Vocabulary Subtitle</h1>

      <div class="field">
        <label class="inline">
          <input id="enabled" type="checkbox" />
          启用字幕词汇替换
        </label>
      </div>

      <div class="field">
        <label class="field-title" for="replaceRatio">替换比例 (0.1 - 0.3)</label>
        <div class="inline">
          <input id="replaceRatio" type="range" min="0.1" max="0.3" step="0.05" />
          <span id="replaceRatioValue">0.20</span>
        </div>
      </div>

      <div class="field">
        <label class="field-title" for="maxReplaceCount">单句替换上限 (1 - 5)</label>
        <input id="maxReplaceCount" type="number" min="1" max="5" step="1" />
      </div>

      <div class="field">
        <label class="field-title" for="targetCefr">目标 CEFR 难度</label>
        <select id="targetCefr">
          <option value="A1">A1 (入门)</option>
          <option value="A2">A2 (初级)</option>
          <option value="B1">B1 (中级)</option>
          <option value="B2" selected>B2 (中高级)</option>
          <option value="C1">C1 (高级)</option>
          <option value="C2">C2 (精通)</option>
        </select>
      </div>

      <div class="field">
        <label class="field-title" for="reviewDanmakuSpeed">复习弹幕速度</label>
        <select id="reviewDanmakuSpeed">
          <option value="slow">慢</option>
          <option value="normal" selected>标准</option>
          <option value="fast">快</option>
        </select>
      </div>

      <div class="field">
        <span class="field-title">激活词汇等级</span>
        <div class="levels">
          <label><input type="checkbox" name="activeLevels" value="CET4" /> CET4</label>
          <label><input type="checkbox" name="activeLevels" value="CET6" /> CET6</label>
          <label><input type="checkbox" name="activeLevels" value="KAOYAN" /> 考研</label>
          <label><input type="checkbox" name="activeLevels" value="IELTS" /> IELTS</label>
          <label><input type="checkbox" name="activeLevels" value="TOEFL" /> TOEFL</label>
        </div>
      </div>

      <button id="saveButton" type="button">保存设置</button>
      <div id="status"></div>
    </main>

    <script src="options.js"></script>
  </body>
</html>
